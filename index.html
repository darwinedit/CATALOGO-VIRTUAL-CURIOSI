<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curiosi — Catálogo</title>
<style>
:root{--bg:#fbf5ee;--card:#fff;--tx:#2b1d12;--mu:#7d6a58;--pr:#c26a24;--pr2:#e0924a;--ok:#12a150;--wa:#25d366;--wn:#e08a00;--bd:#ecdcc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120d;--card:#241c14;--tx:#f6ece0;--mu:#b5a290;--bd:#3a2d21}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-radius:0 0 22px 22px}
header h1{margin:0;font-size:22px}header p{margin:2px 0 10px;font-size:12px;opacity:.9}
input,select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;margin-bottom:10px}
header input{border:0;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px}.chip{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:13px;color:var(--tx)}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}
.p{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(150,90,30,.10);display:flex;flex-direction:column}
.ph{height:150px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#f8e3cc,#fdeed9);position:relative}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ph{background:linear-gradient(135deg,#3a2a1c,#4a3320)}}
.ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;left:8px;background:var(--ok);color:#fff;font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600}
.pb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}.pb b{font-size:14px}.pb small{color:var(--mu);font-size:12px}
.ds{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.th{width:44px;height:44px;border-radius:10px;object-fit:cover;vertical-align:middle;margin-right:6px}.lg{width:30px;height:30px;border-radius:8px;vertical-align:middle;margin-right:6px}
.pr{font-size:17px;font-weight:800;color:var(--pr);margin-top:auto}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;background:var(--pr);color:#fff;width:100%}
.btn.wa{background:var(--wa)}.btn.ok{background:var(--ok)}.btn.gh{background:transparent;color:var(--pr);border:1px solid var(--pr)}.btn.sm{padding:7px 10px;font-size:12px;width:auto}.btn.rd{background:#d93a4a}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;padding:6px 0;position:relative}nav button span{display:block;font-size:22px}nav button.on{color:var(--pr);font-weight:700}
.badge{position:absolute;top:0;left:55%;background:#e5334b;color:#fff;border-radius:99px;font-size:10px;padding:1px 6px}
.box{background:var(--card);border-radius:18px;padding:16px;margin:12px 16px;box-shadow:0 2px 10px rgba(150,90,30,.10)}
.box h2,.box h3{margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 16px}.bal div{border-radius:16px;padding:14px;color:#fff}.bal b{display:block;font-size:22px}
.tabs{display:flex;gap:6px;padding:12px 16px 0}.tabs button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;font-size:13px}.tabs button.on{background:var(--pr);color:#fff}
.st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;color:#fff}
.m{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.m>div{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.q{display:flex;align-items:center;gap:8px}.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2b1d12;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:30;max-width:90%;text-align:center;display:none}
.hero{padding:22px 16px;text-align:center}.hero h2{font-size:24px;margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ====== CONFIGURA AQUÍ ======
const WHATSAPP="51962599148";      // tu número con código de país
const ADMIN_PASS="admin123";       // cambia esta clave
const GANANCIA=5;                  // ganancia por unidad para el vendedor
const FIREBASE_URL="https://registro-de-comisiones-default-rtdb.asia-southeast1.firebasedatabase.app/"; // URL de tu Realtime Database (ver instrucciones)
let PRODUCTS=[ // respaldo: solo se usa si products.json no carga. Tus productos y fotos se leen de products.json
{id:1,n:"Audífonos Bluetooth",c:"Audio",p:45,e:"🎧",img:"",nuevo:1},
{id:2,n:"Smartwatch Fit",c:"Relojes",p:89,e:"⌚",img:"",nuevo:1},
{id:3,n:"Lámpara LED RGB",c:"Hogar",p:29,e:"💡",img:""},
{id:4,n:"Mini Parlante",c:"Audio",p:39,e:"🔊",img:"",nuevo:1},
{id:5,n:"Cargador Rápido 20W",c:"Accesorios",p:25,e:"🔌",img:""},
{id:6,n:"Soporte para Celular",c:"Accesorios",p:15,e:"📱",img:""},
{id:7,n:"Mouse Inalámbrico",c:"Accesorios",p:35,e:"🖱️",img:""},
{id:8,n:"Proyector Galaxia",c:"Hogar",p:55,e:"🌌",img:"",nuevo:1}];
// ============================
const $=s=>document.querySelector(s),fmt=n=>"S/ "+Number(n).toFixed(2),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DB={sellers:[],sales:[],wd:[]},S={tab:"shop",cat:"Todos",q:"",cart:{},sub:"cat",asub:"sales",user:null,admin:false};

const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const sha=async s=>{try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("curiosi:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return s}};
let toastT,AC,PEND=-1;
function toast(t){let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";e.className="toast";document.body.appendChild(e)}e.textContent=t;e.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>e.style.display="none",4000)}
function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(AC.currentTime+.25)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
async function put(col,o){ // guarda UN registro en la nube (no pisa lo de los demás)
 cache();if(!ONLINE)return true;
 try{const r=await fetch(api(col+"/"+o.id),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});if(!r.ok)throw 0;return true}
 catch(e){toast("⚠️ Sin conexión: no se pudo guardar. Intenta de nuevo.");return false}
}
async function pull(){ // descarga todo lo que hay en la nube
 if(!ONLINE)return false;
 try{const r=await fetch(api("")+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const d=(await r.json())||{},L=o=>Object.values(o||{}).filter(Boolean);DB={sellers:L(d.sellers),sales:L(d.sales),wd:L(d.wd)};cache();return true}
 catch(e){return false}
}
const pendN=()=>DB.sales.filter(x=>x.st==="p").length+DB.wd.filter(x=>x.st==="p").length;
async function tick(){ // revisa cada pocos segundos si hay novedades
 if(document.hidden||!(S.user||S.admin))return;
 const before=JSON.stringify(DB);if(!await pull())return;if(JSON.stringify(DB)===before)return;
 if(S.admin){const n=pendN();if(PEND>=0&&n>PEND){beep();toast("🔔 Nueva solicitud pendiente")}PEND=n}
 const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
 if(S.admin||(S.user&&S.tab==="work"))render();
}
setInterval(tick,4000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
const me=()=>DB.sellers.find(x=>x.id===S.user);
const calc=id=>{const ss=DB.sales.filter(x=>x.s===id),pend=ss.filter(x=>x.st==="p").reduce((a,x)=>a+x.g,0),conf=ss.filter(x=>x.st==="c").reduce((a,x)=>a+x.g,0),w=DB.wd.filter(x=>x.s===id&&x.st!=="r").reduce((a,x)=>a+x.a,0);return{pend,avail:conf-w,paid:DB.wd.filter(x=>x.s===id&&x.st==="d").reduce((a,x)=>a+x.a,0)}};
const cartN=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const pic=p=>`<div class="ph">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.n)}" loading="lazy" onerror="this.replaceWith(document.createTextNode('${p.e}'))">`:p.e}${p.nuevo?'<span class="tag">Nuevo</span>':""}</div>`;
function modal(html){const m=document.createElement("div");m.className="m";m.innerHTML=`<div>${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
function render(){
 const bad=S.tab==="cart"?"":cartN()?`<span class="badge">${cartN()}</span>`:"";
 const pd=S.admin?pendN():0,nv=(t,i,l,b="")=>`<button class="${S.tab===t?"on":""}" onclick="S.tab='${t}';render();scrollTo(0,0)"><span>${i}</span>${l}${b}</button>`;
 $("#app").innerHTML=(S.tab==="shop"?shop():S.tab==="cart"?cart():work()+(!ONLINE&&(S.admin||S.user)?`<div class="box" style="background:#d93a4a;color:#fff">⚠️ Falta configurar FIREBASE_URL en index.html: las ventas solo se guardan en este dispositivo.</div>`:""))+`<nav>${nv("shop","🛍️","Tienda")}${nv("cart","🧾","Pedido",bad)}${nv("work","💼","Ganar",pd?`<span class="badge">${pd}</span>`:"")}</nav>`;
}

const gridH=L=>L.length?L.map(p=>`<div class="p">${pic(p)}<div class="pb"><b>${esc(p.n)}</b><small>${esc(p.c)}</small>${p.d?`<small class="ds">${esc(p.d)}</small>`:""}<div class="pr">${fmt(p.p)}</div><button class="btn" onclick="add(${p.id})">+ Agregar</button></div></div>`).join(""):`<p class="mu" style="grid-column:1/3;text-align:center">Sin resultados</p>`;
function srch(){const L=PRODUCTS.filter(p=>(S.cat==="Todos"||p.c===S.cat)&&p.n.toLowerCase().includes(S.q.toLowerCase()));$("#g").innerHTML=gridH(L)}
function add(id,d=1){S.cart[id]=Math.max(0,(S.cart[id]||0)+d);if(!S.cart[id])delete S.cart[id];render()}
function cart(){
 const it=Object.keys(S.cart).map(id=>PRODUCTS.find(p=>p.id==id)),tot=it.reduce((a,p)=>a+p.p*S.cart[p.id],0);
 return `<header><h1>🧾 Tu pedido</h1><p>Revisa y envía por WhatsApp</p></header>`+(it.length?`<div class="box">${it.map(p=>`<div class="row"><div>${p.img?`<img class="th" src="${esc(p.img)}" alt="" onerror="this.remove()">`:p.e} <b>${esc(p.n)}</b><div class="mu">${fmt(p.p)}</div></div><div class="q"><button onclick="add(${p.id},-1)">−</button><b>${S.cart[p.id]}</b><button onclick="add(${p.id},1)">+</button></div></div>`).join("")}<div class="row"><b>Total</b><b style="font-size:20px;color:var(--pr)">${fmt(tot)}</b></div></div><div class="box"><button class="btn wa" onclick="sendWA()">💬 Enviar pedido por WhatsApp</button></div>`:`<div class="box" style="text-align:center"><div style="font-size:50px">🛒</div><p class="mu">Tu pedido está vacío</p><button class="btn" onclick="S.tab='shop';render()">Ver productos</button></div>`)}
function sendWA(){const it=Object.keys(S.cart).map(id=>PRODUCTS.find(p=>p.id==id));let t="Hola Curiosi 👋 quiero pedir:%0A"+it.map(p=>`• ${S.cart[p.id]}x ${p.n} — ${fmt(p.p*S.cart[p.id])}`).join("%0A")+`%0ATotal: ${fmt(it.reduce((a,p)=>a+p.p*S.cart[p.id],0))}`;window.open(`https://wa.me/${WHATSAPP}?text=${t}`,"_blank")}
// ===== Vendedores / Admin =====
function work(){if(S.admin)return admin();if(S.user&&me())return seller();return pitch()}
function pitch(){return `<header><h1>💼 Trabaja con nosotros</h1><p>Gana comisiones vendiendo Curiosi</p></header>
<div class="hero"><div style="font-size:54px">💸</div><h2>Gana S/ ${GANANCIA} por cada venta</h2><p class="mu">Regístrate, comparte el catálogo con tu precio y gana comisión. Tú no manejas stock: nosotros coordinamos la entrega.</p></div>
<div class="box"><h3>Ingresar / Registrarme</h3><input id="ln" placeholder="Tu nombre (solo para registro)"><input id="lp" placeholder="Celular" inputmode="tel"><input id="lk" type="password" placeholder="Contraseña"><button class="btn" onclick="reg()">Crear mi cuenta</button><div style="height:8px"></div><button class="btn gh" onclick="login()">Ya tengo cuenta</button></div>
<div class="box"><button class="btn gh" onclick="adm()">🔐 Soy administrador</button></div>`}
async function reg(){const n=$("#ln").value.trim(),p=$("#lp").value.trim(),k=$("#lk").value;if(!n||p.length<6||k.length<4)return alert("Completa nombre, celular válido y contraseña (mín. 4).");if(ONLINE&&!await pull())return alert("Sin conexión. Intenta de nuevo.");if(DB.sellers.some(s=>s.p===p))return alert("Ese celular ya está registrado.");const s={id:uid(),n,p,k:await sha(k)};DB.sellers.push(s);if(!await put("sellers",s)){DB.sellers.pop();return}S.user=s.id;try{localStorage.setItem("curiosi_user",s.id)}catch(e){}S.sub="cat";render()}
async function login(){const p=$("#lp").value.trim(),k=$("#lk").value;if(ONLINE&&!await pull())return alert("Sin conexión. Intenta de nuevo.");const h=await sha(k),s=DB.sellers.find(x=>x.p===p&&x.k===h);if(!s)return alert("Celular o contraseña incorrectos.");S.user=s.id;try{localStorage.setItem("curiosi_user",s.id)}catch(e){}S.sub="cat";render()}
async function adm(){const k=prompt("Clave de administrador:");if(k===ADMIN_PASS){S.admin=true;beep();await pull();PEND=pendN();render()}else if(k!==null)alert("Clave incorrecta")}
function out(){S.user=null;S.admin=false;PEND=-1;try{localStorage.removeItem("curiosi_user")}catch(e){}render()}
function seller(){const u=me(),w=calc(u.id),tb=(k,l)=>`<button class="${S.sub===k?"on":""}" onclick="S.sub='${k}';render()">${l}</button>`;let b="";
 if(S.sub==="cat")b=`<div class="grid">${PRODUCTS.map(p=>`<div class="p">${pic(p)}<div class="pb"><b>${esc(p.n)}</b><small>Precio normal ${fmt(p.p)}</small><div class="pr">${fmt(p.p+GANANCIA)}</div><small style="color:var(--ok);font-weight:700">Tú ganas ${fmt(GANANCIA)}</small><button class="btn wa" onclick="share(${p.id})">Ofrecer</button><button class="btn gh" onclick="sale(${p.id})">Registrar venta</button></div></div>`).join("")}</div>`;
 if(S.sub==="sales"){const ss=DB.sales.filter(x=>x.s===u.id).reverse();b=`<div class="box"><h3>Mis ventas</h3>${ss.map(x=>`<div class="row"><div><b>${esc(x.pn)}</b> x${x.q}<div class="mu">${esc(x.c)} · ${new Date(x.d).toLocaleDateString()}</div></div><div style="text-align:right"><b>${fmt(x.g)}</b><br><span class="st" style="background:${x.st==="c"?"var(--ok)":x.st==="r"?"#d93a4a":"var(--wn)"}">${x.st==="c"?"Confirmada":x.st==="r"?"Rechazada":"Pendiente"}</span></div></div>`).join("")||'<p class="mu">Aún no registras ventas.</p>'}</div>`}
 if(S.sub==="wal"){const wd=DB.wd.filter(x=>x.s===u.id).reverse();b=`<div class="box"><h3>Retirar ganancias</h3><p class="mu">Mínimo ${fmt(5)}. El administrador verificará y te transferirá.</p><button class="btn ok" onclick="wdraw()" ${w.avail<5?"disabled style='opacity:.5'":""}>Solicitar retiro</button></div><div class="box"><h3>Retiros</h3>${wd.map(x=>`<div class="row"><b>${fmt(x.a)}</b><span class="st" style="background:${x.st==="d"?"var(--ok)":x.st==="r"?"#d93a4a":"var(--wn)"}">${x.st==="d"?"Pagado":x.st==="r"?"Rechazado":"En revisión"}</span></div>`).join("")||'<p class="mu">Sin retiros.</p>'}</div>`}
 return `<header><h1>Hola, ${esc(u.n.split(" ")[0])} 👋</h1><p>Panel de vendedor</p></header>
 <div class="bal"><div style="background:var(--wn)">Saldo pendiente<b>${fmt(w.pend)}</b><small>Esperando confirmación</small></div><div style="background:var(--ok)">Saldo disponible<b>${fmt(w.avail)}</b><small>Ya retirable</small></div></div>
 <div class="tabs">${tb("cat","Catálogo")}${tb("sales","Mis ventas")}${tb("wal","Billetera")}</div>${b}<div class="box"><button class="btn gh" onclick="out()">Cerrar sesión</button></div>`}
function share(id){const p=PRODUCTS.find(x=>x.id===id);window.open(`https://wa.me/?text=${encodeURIComponent(`✨ ${p.n}\nPrecio: ${fmt(p.p+GANANCIA)}\nPide el tuyo conmigo 📲`)}`,"_blank")}
function sale(id){const p=PRODUCTS.find(x=>x.id===id),m=modal(`<h3>Registrar venta: ${esc(p.n)}</h3><input id="mc" placeholder="Nombre del cliente"><input id="mq" type="number" min="1" value="1"><button class="btn ok" id="mo">Enviar para confirmación</button>`);$("#mo").onclick=async()=>{const c=$("#mc").value.trim(),q=Math.max(1,parseInt($("#mq").value)||1);if(!c)return alert("Escribe el cliente");const b=$("#mo");b.disabled=true;b.textContent="Enviando...";const r={id:uid(),s:S.user,pid:id,pn:p.n,c,q,g:GANANCIA*q,st:"p",d:Date.now()};DB.sales.push(r);if(!await put("sales",r)){DB.sales.pop();b.disabled=false;b.textContent="Enviar para confirmación";return}m.remove();S.sub="sales";render();toast("✅ Venta enviada al administrador")}}
async function wdraw(){const w=calc(S.user);if(w.avail<5)return;const r={id:uid(),s:S.user,a:w.avail,st:"p",d:Date.now()};DB.wd.push(r);render();if(!await put("wd",r)){DB.wd.pop();render()}}
function admin(){const tb=(k,l)=>`<button class="${S.asub===k?"on":""}" onclick="S.asub='${k}';render()">${l}</button>`,nm=id=>{const s=DB.sellers.find(x=>x.id===id);return s?esc(s.n)+" · "+esc(s.p):"?"};let b="";
 if(S.asub==="sales")b=`<div class="box"><h3>Ventas por confirmar</h3>${DB.sales.filter(x=>x.st==="p").map(x=>`<div class="row"><div><b>${esc(x.pn)}</b> x${x.q}<div class="mu">${nm(x.s)}<br>Cliente: ${esc(x.c)} · Comisión ${fmt(x.g)}</div></div><div><button class="btn sm ok" onclick="dec('sales',${x.id},'c')">✓</button> <button class="btn sm rd" onclick="dec('sales',${x.id},'r')">✕</button></div></div>`).join("")||'<p class="mu">Nada pendiente.</p>'}</div>`;
 if(S.asub==="wd")b=`<div class="box"><h3>Retiros solicitados</h3>${DB.wd.filter(x=>x.st==="p").map(x=>`<div class="row"><div><b>${fmt(x.a)}</b><div class="mu">${nm(x.s)}</div></div><div><button class="btn sm ok" onclick="dec('wd',${x.id},'d')">Pagado</button> <button class="btn sm rd" onclick="dec('wd',${x.id},'r')">✕</button></div></div>`).join("")||'<p class="mu">Sin solicitudes.</p>'}</div>`;
 if(S.asub==="sel")b=`<div class="box"><h3>Vendedores (${DB.sellers.length})</h3>${DB.sellers.map(s=>{const w=calc(s.id);return `<div class="row"><div><b>${esc(s.n)}</b><div class="mu">${esc(s.p)}</div></div><div style="text-align:right" class="mu">Pend. ${fmt(w.pend)}<br>Disp. ${fmt(w.avail)}<br>Pagado ${fmt(w.paid)}</div></div>`}).join("")||'<p class="mu">Sin vendedores.</p>'}</div>`;
 return `<header><h1>🔐 Administrador</h1><p>Confirma ventas y retiros</p></header><div class="tabs">${tb("sales","Ventas")}${tb("wd","Retiros")}${tb("sel","Vendedores")}</div>${b}<div class="box"><button class="btn gh" onclick="out()">Salir</button></div>`}
async function dec(t,id,st){const x=(t==="sales"?DB.sales:DB.wd).find(y=>y.id===id);if(!x)return;const o=x.st;x.st=st;render();if(!await put(t,x)){x.st=o;render()}}
// ===== Carga tus productos y fotos desde products.json (igual que tu catálogo actual) =====
fetch("products.json?v="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{if(!Array.isArray(d)||!d.length)throw 0;PRODUCTS=d.map((p,i)=>({id:i+1,n:String(p.name||""),c:String(p.category||"Otros"),p:Number(p.price)||0,e:"🛍️",img:p.image||"",d:p.description||"",nuevo:(p.nuevo||p.new)?1:0}))}).catch(()=>{}).finally(async()=>{render();if(await pull())render()});
</script>
</body>
</html>
